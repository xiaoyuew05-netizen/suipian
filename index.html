<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>碎片 · 知识卡片</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f1115; --card:#191c22; --card2:#21252d; --line:#2c313b;
    --fg:#e9ecf1; --dim:#98a1b0; --accent:#6ea8fe; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:17px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none;
  }
  #app{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:64px}
  header{padding:14px 16px 6px;display:flex;align-items:baseline;gap:10px}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:13px}
  main{flex:1;padding:0 16px 16px}
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;background:#12151aee;backdrop-filter:blur(8px);
    border-top:1px solid var(--line);display:flex;max-width:680px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom)
  }
  .tabbar button{
    flex:1;background:none;border:0;color:var(--dim);font-size:12px;padding:9px 0 11px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;cursor:pointer
  }
  .tabbar button .ico{font-size:19px;line-height:1}
  .tabbar button.on{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .btn{
    display:block;width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);color:var(--fg);font-size:17px;font-family:inherit;cursor:pointer
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:700}
  .btn:active{transform:scale(.985)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
  input[type=text],textarea,select{
    width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:#0d1015;color:var(--fg);font-size:16px;font-family:inherit;outline:none
  }
  textarea{resize:vertical;min-height:70px}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  .hint{font-size:12px;color:var(--dim);margin-top:4px}
  .stat{display:flex;gap:10px;margin-bottom:14px}
  .stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}
  .stat b{display:block;font-size:22px;color:var(--accent)}
  .stat span{font-size:12px;color:var(--dim)}
  .chip{display:inline-block;padding:4px 10px;border-radius:999px;background:#252a33;color:var(--dim);font-size:12px;margin:0 6px 6px 0}
  .cardlist .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
  .cardlist .item h3{margin:0 0 4px;font-size:16px}
  .cardlist .item p{margin:0;color:var(--dim);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .study{display:flex;flex-direction:column;justify-content:center;min-height:calc(100dvh - 190px)}
  .qbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
  .qbox .domain{font-size:12px;color:var(--dim);letter-spacing:1px}
  .qbox h2{font-size:26px;margin:10px 0 16px;line-height:1.35}
  .qimg{width:100%;max-height:44dvh;object-fit:contain;border-radius:12px;margin:8px 0 4px;background:#000}
  .answer{text-align:left;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}
  .answer .core{font-size:19px;color:#fff;margin-bottom:12px}
  .answer .detail{color:#cfd6e2;white-space:pre-wrap}
  .answer .eg{color:var(--warn);font-size:15px;margin-top:12px;white-space:pre-wrap}
  .grades{display:flex;gap:9px;margin-top:16px}
  .grades button{flex:1;padding:16px 0;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-size:16px;font-family:inherit;cursor:pointer}
  .grades button.g0{border-color:#5a2a2a;color:var(--bad)}
  .grades button.g1{border-color:#5c4a22;color:var(--warn)}
  .grades button.g2{border-color:#22543d;color:var(--ok)}
  .empty{color:var(--dim);text-align:center;padding:50px 10px;font-size:15px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#2b3240;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .topbar .back{background:none;border:0;color:var(--accent);font-size:16px;font-family:inherit;cursor:pointer;padding:6px 0}
  .topbar .grow{flex:1}
  .progress{height:4px;background:#252a33;border-radius:99px;margin:6px 0 16px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  /* 滑动手势 */
  .swipe{position:relative;touch-action:pan-y;will-change:transform;transition:transform .2s ease,opacity .2s ease}
  .swipe.dragging{transition:none}
  .swipe .tint{position:absolute;inset:0;border-radius:18px;pointer-events:none;opacity:0;transition:opacity .12s}
  .swipe .badge{position:absolute;top:16px;padding:7px 16px;border-radius:999px;font-size:17px;font-weight:700;
    opacity:0;transition:opacity .12s;pointer-events:none;letter-spacing:1px}
  .swipe .badge.bl{left:16px;background:rgba(255,107,107,.16);color:#ff8b8b;border:2px solid rgba(255,107,107,.5)}
  .swipe .badge.br{right:16px;background:rgba(61,220,151,.16);color:#3ddc97;border:2px solid rgba(61,220,151,.5)}
  .swipe .badge.bu{left:50%;transform:translateX(-50%);background:rgba(255,180,84,.16);color:#ffc46b;border:2px solid rgba(255,180,84,.5)}
  .hintswipe{text-align:center;color:var(--dim);font-size:13px;margin-top:12px;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <header><h1>碎片</h1><span class="sub" id="hdsub"></span></header>
  <main id="view"></main>
  <nav class="tabbar">
    <button data-tab="today" class="on"><span class="ico">◎</span>今日</button>
    <button data-tab="study"><span class="ico">▤</span>学习</button>
    <button data-tab="add"><span class="ico">＋</span>记卡</button>
    <button data-tab="lib"><span class="ico">☰</span>卡片</button>
    <button data-tab="set"><span class="ico">⚙</span>设置</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 存储层 ================= */
const DB_NAME='suipian-db', STORE='cards', LS_KEY='suipian-cards', LS_META='suipian-meta';
let db=null, idbOK=false;

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{ const d=e.target.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'id'}); };
    r.onsuccess=e=>{ db=e.target.result; res(db) };
    r.onerror=()=>rej(r.error);
  });
}
function tx(mode){ return db.transaction(STORE,mode).objectStore(STORE); }

async function storeAll(){
  if(idbOK){
    return await new Promise((res,rej)=>{ const out=[]; const q=tx('readonly').openCursor();
      q.onsuccess=e=>{ const c=e.target.result; if(c){ out.push(c.value); c.continue(); } else res(out) }; q.onerror=()=>rej(q.error); });
  }
  try{ return JSON.parse(localStorage.getItem(LS_KEY)||'[]') }catch(e){ return [] }
}
async function storePut(card){
  if(idbOK){ return await new Promise((res,rej)=>{ const q=tx('readwrite').put(card); q.onsuccess=()=>res(card); q.onerror=()=>rej(q.error) }) }
  const all=await storeAll(); const i=all.findIndex(c=>c.id===card.id);
  if(i>=0) all[i]=card; else all.push(card);
  localStorage.setItem(LS_KEY,JSON.stringify(all)); return card;
}
async function storeDel(id){
  if(idbOK){ return await new Promise((res,rej)=>{ const q=tx('readwrite').delete(id); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error) }) }
  const all=(await storeAll()).filter(c=>c.id!==id); localStorage.setItem(LS_KEY,JSON.stringify(all));
}
async function storeClear(){
  if(idbOK){ return await new Promise((res,rej)=>{ const q=tx('readwrite').clear(); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error) }) }
  localStorage.removeItem(LS_KEY);
}

/* ================= 元数据 ================= */
function meta(){ try{ return JSON.parse(localStorage.getItem(LS_META)||'{}') }catch(e){ return {} } }
function setMeta(o){ localStorage.setItem(LS_META,JSON.stringify(Object.assign(meta(),o))) }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }

/* ================= 间隔重复 ================= */
const DAY=86400000;
function schedule(srs,grade){
  let {interval=0,ease=2.5,reps=0,lapses=0}=srs||{};
  if(grade===0){ interval=0.007; ease=Math.max(1.3,ease-0.2); lapses+=1; reps=0; }
  else if(grade===1){ interval = reps===0 ? 0.35 : Math.max(1,interval*1.4); reps+=1; }
  else { interval = reps===0 ? 1 : reps===1 ? 3 : Math.max(1,interval*ease); ease=Math.min(3.0,ease+0.08); reps+=1; }
  return {interval:+interval.toFixed(3),ease:+ease.toFixed(2),reps,lapses,due:Date.now()+interval*DAY,last:Date.now()};
}
const isDue=c=>!c.srs||c.srs.due<=Date.now();
const isNew=c=>!c.srs;
const mastered=c=>c.srs&&c.srs.interval>=21;

/* ================= 状态 ================= */
let CARDS=[];
let session=null;      // {queue:[], idx:0, stats:{good,fuzzy,bad}}
let editing=null;

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600) }
function uid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7) }
const DOMAINS=['科学','历史','人文','自然','技术','生活','人物','杂学'];

/* ================= 视图路由 ================= */
let tab='today';
function go(t){ tab=t; document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); render(); }
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{ if(b.dataset.tab==='study'){ startStudy() } else { go(b.dataset.tab) } });

async function reload(){ CARDS=await storeAll(); }
function headerSub(){
  const m=meta();
  const tot=CARDS.length, mast=CARDS.filter(mastered).length;
  $('#hdsub').textContent = tot? `${tot} 张 · 掌握 ${mast}` : '还没有卡片';
}

/* ================= 今日 ================= */
function renderToday(){
  const due=CARDS.filter(c=>!isNew(c)&&isDue(c)).length;
  const newToday=(meta().newDate===todayStr()? (meta().newCount||0):0);
  const target=meta().dailyNew||3;
  const streak=meta().streak||0;
  const mast=CARDS.filter(mastered).length;
  $('#view').innerHTML=`
    <div class="stat">
      <div><b>${CARDS.length}</b><span>总卡片</span></div>
      <div><b>${due}</b><span>待复习</span></div>
      <div><b>${streak}</b><span>连续天数</span></div>
    </div>
    <div class="card">
      <div style="font-size:17px;margin-bottom:6px">今天的学习任务</div>
      <div style="color:var(--dim);font-size:14px;margin-bottom:14px">
        复习 <b style="color:var(--fg)">${due}</b> 张 · 新卡 <b style="color:var(--fg)">${Math.max(0,target-newToday)}</b> 张（每天目标 ${target} 张，约 5 分钟）
      </div>
      <button class="btn primary" onclick="startStudy()">开始学习</button>
    </div>
    ${CARDS.length? `<div class="card">
      <div style="font-size:15px;margin-bottom:10px">随便逛逛（拓广知识面）</div>
      <button class="btn" onclick="randomRead()">🎲 随机抽一张看看</button>
    </div>` : `<div class="card"><div style="color:var(--dim);font-size:14px">还没有卡片，去「记卡」新建第一张吧。</div></div>`}
  `;
}

/* ================= 滑动手势 ================= */
function attachSwipe(){
  const el=document.getElementById('swipeCard');
  if(!el) return;
  const badges={l:el.querySelector('.badge.bl'),u:el.querySelector('.badge.bu'),r:el.querySelector('.badge.br')};
  let sx=0,sy=0,dx=0,dy=0,active=false;
  const revealed=()=>!!document.querySelector('.grades');

  function clearVisual(){
    el.style.transform=''; el.style.opacity='';
    Object.values(badges).forEach(b=>b&&(b.style.opacity=0));
  }
  function pick(dx,dy){
    if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>70) return dx<0?0:2;
    if(dy<-70) return 1;
    return -1;
  }
  el.addEventListener('pointerdown',e=>{
    if(!revealed()) return;
    active=true; sx=e.clientX; sy=e.clientY; dx=dy=0;
    el.classList.add('dragging');
    try{ el.setPointerCapture(e.pointerId) }catch(_){}
  });
  el.addEventListener('pointermove',e=>{
    if(!active) return;
    dx=e.clientX-sx; dy=e.clientY-sy;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/24}deg)`;
    const g=pick(dx,dy);
    badges.l.style.opacity=0; badges.u.style.opacity=0; badges.r.style.opacity=0;
    const k=Math.min(1,Math.max(Math.abs(dx),Math.abs(dy))/90);
    if(g===0) badges.l.style.opacity=k;
    else if(g===2) badges.r.style.opacity=k;
    else if(g===1) badges.u.style.opacity=k;
  });
  function finish(){
    if(!active) return;
    active=false; el.classList.remove('dragging');
    const g=pick(dx,dy);
    if(g<0){ clearVisual(); return }
    el.style.transition='transform .22s ease, opacity .22s ease';
    const tx = g===0? -600 : g===2? 600 : dx;
    const ty = g===1? -600 : dy;
    el.style.transform=`translate(${tx}px,${ty}px) rotate(${tx/20}deg)`;
    el.style.opacity='0';
    setTimeout(()=>grade(g),170);
  }
  el.addEventListener('pointerup',finish);
  el.addEventListener('pointercancel',finish);
}

/* ================= 学习会话 ================= */
function startStudy(){
  const target=meta().dailyNew||3;
  const newToday=(meta().newDate===todayStr()? (meta().newCount||0):0);
  const due=CARDS.filter(isDue).filter(c=>!isNew(c));
  const newCards=CARDS.filter(isNew).slice(0,Math.max(0,target-newToday));
  const queue=[...due,...newCards];
  if(!queue.length){ go('today'); toast('今天没有要学的内容'); return; }
  session={queue,idx:0,stats:{good:0,fuzzy:0,bad:0}};
  tab='study'; document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='study'));
  renderStudy();
}
function renderStudy(){
  if(!session){ startStudy(); return; }
  if(session.idx>=session.queue.length){ return renderDone(); }
  const c=session.queue[session.idx];
  const pct=Math.round(session.idx/session.queue.length*100);
  $('#view').innerHTML=`
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="study">
      <div class="qbox swipe" id="swipeCard" onclick="if(!document.querySelector('.grades'))reveal()">
        <span class="badge bl">忘了</span><span class="badge bu">模糊</span><span class="badge br">记得</span>
        <div class="domain">${esc(c.domain||'杂学')}${isNew(c)?' · 新卡':''}</div>
        <h2>${esc(c.title)}</h2>
        ${c.img? `<img class="qimg" src="${c.img}" alt="">`:''}
        <div id="ans"></div>
      </div>
      <div id="gradewrap" style="margin-top:16px">
        <button class="btn primary" onclick="reveal()">翻面看答案</button>
      </div>
    </div>`;
  attachSwipe();
}
window.reveal=function(){
  const c=session.queue[session.idx];
  $('#ans').innerHTML=`<div class="answer">
      <div class="core">${esc(c.core)}</div>
      ${c.detail? `<div class="detail">${esc(c.detail)}</div>`:''}
      ${c.example? `<div class="eg">例：${esc(c.example)}</div>`:''}
      ${(c.tags&&c.tags.length)? `<div style="margin-top:12px">${c.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
    </div>`;
  $('#gradewrap').innerHTML=`<div class="grades">
      <button class="g0" onclick="grade(0)">忘了</button>
      <button class="g1" onclick="grade(1)">模糊</button>
      <button class="g2" onclick="grade(2)">记得</button>
    </div>
    <div class="hintswipe">← 忘了　↑ 模糊　→ 记得</div>`;
};
window.grade=async function(g){
  const c=session.queue[session.idx];
  const wasNew=isNew(c);
  c.srs=schedule(c.srs,g);
  await storePut(c);
  if(wasNew){ if(meta().newDate!==todayStr()) setMeta({newDate:todayStr(),newCount:0}); setMeta({newCount:(meta().newCount||0)+1}); }
  if(g===0) session.stats.bad++; else if(g===1) session.stats.fuzzy++; else session.stats.good++;
  session.idx++;
  await reload();
  if(g===0 && !wasNew){ session.queue.push(c); }   // 忘了 → 今天末尾再来一次
  renderStudy();
};
function renderDone(){
  const m=meta();
  const last=m.lastStudy&&new Date(m.lastStudy).toDateString()===new Date().toDateString();
  const st=session.stats;
  $('#view').innerHTML=`
    <div class="empty" style="padding-top:60px">
      <div style="font-size:44px">✓</div>
      <div style="font-size:20px;color:var(--fg);margin:10px 0">今天完成了</div>
      <div>记得 ${st.good} · 模糊 ${st.fuzzy} · 忘了 ${st.bad}</div>
    </div>
    <button class="btn primary" onclick="go('today')">回到今日</button>`;
  // 连续天数
  const t=todayStr();
  if(m.lastStudyDate!==t){
    const y=new Date(Date.now()-DAY); const ys=todayStr(y);
    const streak=(m.lastStudyDate===ys)? (m.streak||0)+1 : 1;
    setMeta({lastStudyDate:t,streak,lastStudy:Date.now()});
  }
  session=null;
}
window.randomRead=function(){
  if(!CARDS.length) return;
  const c=CARDS[Math.floor(Math.random()*CARDS.length)];
  $('#view').innerHTML=`
    <div class="topbar"><button class="back" onclick="go('today')">‹ 返回</button></div>
    <div class="qbox">
      <div class="domain">${esc(c.domain||'杂学')}</div>
      <h2>${esc(c.title)}</h2>
      ${c.img? `<img class="qimg" src="${c.img}">`:''}
      <div class="answer" style="margin-top:14px">
        <div class="core">${esc(c.core)}</div>
        ${c.detail? `<div class="detail">${esc(c.detail)}</div>`:''}
        ${c.example? `<div class="eg">例：${esc(c.example)}</div>`:''}
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" onclick="randomRead()">再来一张</button>
      <button class="btn" onclick="editCard('${c.id}')">编辑</button>
    </div>`;
};

/* ================= 记卡 ================= */
function renderAdd(card){
  const c=card||editing||{};
  const dom=DOMAINS.includes(c.domain)?c.domain:'';
  $('#view').innerHTML=`
    <div class="card">
      <label>标题 <span style="color:var(--bad)">*</span></label>
      <input type="text" id="f-title" value="${esc(c.title||'')}" placeholder="例：C30 混凝土">
      <label>一句话核心 <span style="color:var(--bad)">*</span></label>
      <input type="text" id="f-core" value="${esc(c.core||'')}" placeholder="30 字内说清楚">
      <label>领域 <span style="color:var(--bad)">*</span></label>
      <select id="f-domain">
        <option value="">选择领域…</option>
        ${DOMAINS.map(d=>`<option value="${d}" ${dom===d?'selected':''}>${d}</option>`).join('')}
      </select>
      <label>详细解释（选填）</label>
      <textarea id="f-detail" placeholder="展开讲，3-5 句，可以后补">${esc(c.detail||'')}</textarea>
      <label>例子 / 应用（选填）</label>
      <textarea id="f-example" style="min-height:50px" placeholder="让它落地">${esc(c.example||'')}</textarea>
      <label>标签（选填，逗号分隔）</label>
      <input type="text" id="f-tags" value="${esc((c.tags||[]).join(','))}" placeholder="例：材料,规范">
      <label>配图（选填）</label>
      <input type="file" id="f-img" accept="image/*" style="font-size:14px;padding:8px 0">
      <div class="hint">手机点这里可以直接拍照或从相册选</div>
      <div id="previewwrap" style="margin-top:10px">${c.img?`<img src="${c.img}" style="width:100%;border-radius:10px">`:''}</div>
      <div class="row" style="margin-top:18px">
        <button class="btn primary" onclick="saveCard('${c.id||''}')">保存</button>
        ${c.id?`<button class="btn" style="flex:0 0 96px" onclick="delCard('${c.id}')">删除</button>`:''}
      </div>
    </div>`;
  let imgData=c.img||'';
  const fi=$('#f-img');
  if(fi) fi.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    imgData=await compress(f);
    $('#previewwrap').innerHTML=`<img src="${imgData}" style="width:100%;border-radius:10px">`;
  };
  window._imgData=()=>imgData;
}
function compress(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1000; let w=img.width,h=img.height;
        if(w>max||h>max){ const k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',0.72));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
window.saveCard=async function(id){
  const title=$('#f-title').value.trim(), core=$('#f-core').value.trim(), domain=$('#f-domain').value;
  if(!title){ toast('标题不能空'); return }
  if(!core){ toast('写一句话核心'); return }
  if(!domain){ toast('选一个领域'); return }
  const old=id? CARDS.find(c=>c.id===id):null;
  const card=Object.assign({
    id:id||uid(), createdAt:(old&&old.createdAt)||Date.now(), srs:(old&&old.srs)||null
  },{
    title, core, domain,
    detail:$('#f-detail').value.trim(),
    example:$('#f-example').value.trim(),
    tags:$('#f-tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    img:(window._imgData?window._imgData():'')||''
  });
  await storePut(card);
  await reload();
  toast(id?'已更新':'已保存');
  editing=null;
  if(id) go('lib'); else { renderAdd(); }
};

/* ================= 卡片库 ================= */
let libFilter='', libDomain='';
function renderLib(){
  let list=CARDS.slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(libDomain) list=list.filter(c=>c.domain===libDomain);
  if(libFilter){ const q=libFilter.toLowerCase(); list=list.filter(c=>(c.title+c.core+(c.tags||[]).join()).toLowerCase().includes(q)) }
  $('#view').innerHTML=`
    <input type="text" id="q" placeholder="搜索标题 / 核心 / 标签" value="${esc(libFilter)}">
    <div style="margin:10px 0 12px;overflow-x:auto;white-space:nowrap">
      <span class="chip" style="cursor:pointer;${libDomain?'':'background:var(--accent);color:#0b1020'}" onclick="setDomain('')">全部</span>
      ${DOMAINS.map(d=>`<span class="chip" style="cursor:pointer;${libDomain===d?'background:var(--accent);color:#0b1020':''}" onclick="setDomain('${d}')">${d}</span>`).join('')}
    </div>
    <div class="cardlist">
      ${list.length? list.map(c=>`
        <div class="item" onclick="editCard('${c.id}')">
          <h3>${esc(c.title)}</h3>
          <p>${esc(c.core)}</p>
          <div style="margin-top:6px;font-size:12px;color:var(--dim)">
            ${esc(c.domain||'')} ${mastered(c)?'· 已掌握':(isNew(c)?'· 未学':'· 复习中')}
          </div>
        </div>`).join('') : `<div class="empty">没有匹配的卡片</div>`}
    </div>`;
  const q=$('#q');
  if(q) q.oninput=e=>{ libFilter=e.target.value; const v=e.target.selectionStart; renderLib(); const n=$('#q'); n.focus(); n.setSelectionRange(v,v) };
}
window.setDomain=d=>{ libDomain=d; renderLib() };
window.editCard=async id=>{ editing=CARDS.find(c=>c.id===id); go('add'); renderAdd(editing) };
window.delCard=async id=>{ if(!confirm('确定删除这张卡？')) return; await storeDel(id); await reload(); toast('已删除'); go('lib') };

/* ================= 设置 ================= */
function renderSet(){
  const m=meta();
  $('#view').innerHTML=`
    <div class="card">
      <label>每天新卡数（一屏一张约 1 分钟）</label>
      <select id="s-new" onchange="setDaily(this.value)">
        ${[1,2,3,5,8,10].map(n=>`<option value="${n}" ${(m.dailyNew||3)===n?'selected':''}>${n} 张</option>`).join('')}
      </select>
      <div class="hint">3 张 ≈ 5 分钟（含复习）</div>
    </div>
    <div class="card">
      <div style="font-size:15px;margin-bottom:6px">内容更新</div>
      <div style="color:var(--dim);font-size:13px;margin-bottom:10px">上次检查：<span id="lastchk">—</span></div>
      <button class="btn primary" onclick="checkUpdates(true)">检查新卡片</button>
      <div class="hint">从云端拉取最新卡片包，只添加你还没有的，不会覆盖已有学习记录</div>
    </div>
    <div class="card">
      <div style="font-size:15px;margin-bottom:10px">数据</div>
      <button class="btn" onclick="exportJSON()">导出备份（JSON，含图片）</button>
      <div style="height:10px"></div>
      <button class="btn" onclick="document.getElementById('imp').click()">导入备份</button>
      <input type="file" id="imp" accept="application/json" style="display:none">
      <div style="height:10px"></div>
      <button class="btn" onclick="exportCSV()">导出 CSV（表格，不含图片）</button>
      <div style="height:10px"></div>
      <button class="btn" style="color:var(--bad);border-color:#5a2a2a" onclick="clearAll()">清空所有卡片</button>
      <div class="hint" style="margin-top:12px">数据保存在这台设备的浏览器里（${idbOK?'IndexedDB':'localStorage'}）。换手机前先导出备份。</div>
    </div>
    <div class="card">
      <div style="font-size:15px;margin-bottom:6px">说明</div>
      <div style="color:var(--dim);font-size:14px;line-height:1.7">
        · 卡片按间隔重复安排复习：忘了明天再来，记得就隔更久<br>
        · 文字卡片和图片都存在本地，不上传<br>
        · 每天 3 张新卡 + 到期复习，5 分钟能完成
      </div>
    </div>`;
  const imp=$('#imp');
  if(imp) imp.onchange=importJSON;
  renderLastChk();
}
window.setDaily=v=>{ setMeta({dailyNew:+v}); toast('已设置为每天 '+v+' 张') };
window.exportJSON=()=>{
  const data=JSON.stringify({version:1,exported:new Date().toISOString(),cards:CARDS},null,0);
  download('碎片备份-'+todayStr()+'.json','application/json',data);
};
window.exportCSV=()=>{
  const rows=[['标题','一句话核心','领域','详细解释','例子','标签','创建时间','复习次数','下次复习']];
  CARDS.forEach(c=>rows.push([c.title,c.core,c.domain,c.detail,c.example,(c.tags||[]).join(' '),
    new Date(c.createdAt).toLocaleDateString(), c.srs?c.srs.reps:0, c.srs?new Date(c.srs.due).toLocaleDateString():'']));
  const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download('碎片卡片-'+todayStr()+'.csv','text/csv',csv);
};
function download(name,type,text){
  const b=new Blob([text],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
}
window.importJSON=function(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result); const arr=Array.isArray(d)?d:(d.cards||[]);
      let n=0;
      for(const c of arr){ if(!c.id) c.id=uid(); await storePut(c); n++; }
      await reload(); toast('导入 '+n+' 张'); render(); 
    }catch(err){ toast('文件格式不对') }
  };
  r.readAsText(f);
};
window.clearAll=async()=>{
  if(!confirm('确定清空全部卡片？建议先导出备份。')) return;
  await storeClear(); await reload(); toast('已清空'); go('today');
};

/* ================= 云端内容更新 ================= */
const FEED='cards.json';
function renderLastChk(){
  const el=document.getElementById('lastchk');
  if(!el) return;
  const t=meta().lastFeed;
  el.textContent = t? new Date(t).toLocaleString('zh-CN') : '还没检查过';
}
window.checkUpdates=async function(manual){
  const btn=(typeof event!=='undefined' && event && event.target && event.target.tagName==='BUTTON')? event.target : null;
  if(btn){ btn.disabled=true; btn.textContent='检查中…' }
  try{
    const r=await fetch(FEED+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    const arr=Array.isArray(d)? d : (d.cards||[]);
    const byId=new Map(CARDS.map(c=>[c.id,c]));
    let n=0,upd=0, seen=new Set();
    for(const c of arr){
      if(!c.id) c.id='feed'+Math.random().toString(36).slice(2,9);
      if(seen.has(c.id)) continue;
      seen.add(c.id);
      const old=byId.get(c.id);
      if(old){
        // 已有的卡：只补空缺字段（图片/解释/例子/标签），绝不覆盖学习记录
        let ch=false;
        ['img','detail','example'].forEach(k=>{ if(!old[k] && c[k]){ old[k]=c[k]; ch=true } });
        if((!old.tags||!old.tags.length) && c.tags && c.tags.length){ old.tags=c.tags; ch=true }
        if(ch){ await storePut(old); upd++ }
        continue;
      }
      await storePut(c); n++;
    }
    await reload(); setMeta({lastFeed:Date.now()});
    if(tab==='set') { renderSet(); renderLastChk(); }
    if(manual||n||upd){
      const parts=[];
      if(n) parts.push('新增 '+n+' 张');
      if(upd) parts.push('补充 '+upd+' 张');
      toast(parts.length? parts.join('，') : '已经是最新的');
    }
    return n+upd;
  }catch(e){
    if(manual) toast('获取失败：检查网络或稍后再试');
    return 0;
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='检查新卡片' }
  }
};

/* ================= 渲染入口 ================= */
function render(){
  headerSub();
  if(tab==='today') renderToday();
  else if(tab==='add') renderAdd(editing);
  else if(tab==='lib') renderLib();
  else if(tab==='set') renderSet();
  else if(tab==='study') renderStudy();
}

/* ================= 启动 ================= */
(async function init(){
  try{ await idbOpen(); idbOK=true }catch(e){ idbOK=false }
  await reload();
  render();
  // 每天首次打开自动检查云端新卡片
  if(location.protocol.indexOf('http')===0 && Date.now()-(meta().lastFeed||0) > 86400000){
    checkUpdates(false);
  }
})();
</script>
